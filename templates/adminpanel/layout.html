{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Smart Water System{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'style.css' %}">

  <style>
    * {
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background:linear-gradient(rgba(4, 9, 30, 0.7),rgba(4,9,30,0.7)), url("{% static 'img/Atri.jpg' %}") no-repeat center center fixed;
      background-size: cover;
      color: white;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    nav img {
      height: 60px;
    }

    .nav-links ul {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-links ul li a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s;
    }

    .nav-links ul li a:hover {
      color: #00aced;
    }

    .center-content {
      height: 85vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 25rem 2rem 2rem;
    }

    .center-content h1 {
      font-size: 3rem;
      margin-bottom: 2rem;
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
    }

    .btn {
      margin: 10px;
      padding: 12px 30px;
      background-color: #fcfcfd;
      color: white;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: 0.3s;
      display: inline-block;
    }

    .btn:hover {
      background-color: #1c4d81;
      transform: scale(1.05);
    }

    section {
      padding: 60px 20px;
      text-align: center;
    }

    .row{
    margin-top:50px;
    display: flex;
    justify-content:center;
    align-items: center;
   
}
.BUILDINGS-col img{
    height: 250px;
    width: 250px;
    margin: 40px;
    display: block;
    align-items: center;
}
.BUILDINGS-col h2{
    text-align: center;
    font-size: 20px;
    color:whitesmoke;
}
    .about-section,.contact-section {
      max-width: 900px;
      margin-top: 20px;
    }

    h2 {
      font-size: 2rem;
      color: #00aced;
      margin-bottom: 1.2rem;
    }

    p {
      font-size: 16px;
      line-height: 1.7;
      margin-bottom: 1rem;
    }

    @media (max-width: 768px) {
      .nav-links ul {
        flex-direction: column;
        align-items: center;
      }

      .center-content h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>

<body>
    <nav>
    <a href="#"><img src="{% static 'img/LOGO1.png' %}" alt="LOGO" /></a>
    <div class="nav-links">
      <ul>
          <li><a href="{% url 'base' %}">Home</a></li>
          <li><a href="{% url 'base' %}">About</a></li>
          <li><a href="{% url 'base' %}">Contact</a></li>
          <li><a href="{% url 'base' %}">Users</a></li>
          <li><a href="{% url 'logout' %}">Logout</a></li>
        </ul>
    </div>
  </nav>
    {% block content %}{% endblock %}

</body>
</html>
