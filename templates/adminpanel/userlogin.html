{% extends 'adminpanel/layout.html' %}
{% load static %}

{% block content %}
<style>
    .admin-login-wrapper {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  padding-top: 100px; /* space below fixed navbar */
}

  .form-container {
  padding: 45px 35px;
  border-radius: 15px;
  width: 100%;
  max-width: 400px;
  text-align: center;
  background-color: rgb(30, 30, 112);
}

    h2 {
      margin-bottom: 25px;
      font-size: 28px;
      letter-spacing: 1px;
      color: #00e5ff;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      background: linear-gradient(rgba(4, 9, 30, 0.7),rgba(4,9,30,0.7));
      color: white;
      font-size: 15px;
      outline: none;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.75);
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: #00b4d8;
      color: white;
      font-weight: bold;
      font-size: 16px;
      transition: background-color 0.3s;
      cursor: pointer;
    }

    button:hover {
      background-color: #0077b6;
    }

  </style>

<div class="admin-login-wrapper">
<div class="form-container">
      <form method="POST">
        {% csrf_token %}
        <h2>User Login</h2>
        <input type="text" name="username" placeholder="Username" required><br>
        <input type="password" name="password" placeholder="Password" required><br>
        <button type="submit">Login</button>
      </form>
    </div>
    </div>
  
{% endblock %}
